# agent-secret — Cloudflare Worker config
#
# This server is zero-knowledge: it holds NO secrets/keys of its own. All
# encryption happens in the browser; the Worker only stores opaque ciphertext.
# Deploy:
#   1. wrangler kv namespace create SECRETS   -> paste the id below
#   2. wrangler deploy

name = "agent-secret"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"
account_id = "f45123901a41edb8279af5edf727894a" # XNDR Private

# Short host for the claim links (s.xndr.io/<code>#<key>) + the brand host.
[[routes]]
pattern = "s.xndr.io"
custom_domain = true

[[routes]]
pattern = "agent-secret.xndr.io"
custom_domain = true

[[kv_namespaces]]
binding = "SECRETS"
id = "63a528cba871428998ae658a56fa6092"

[vars]
# Requests per minute per IP across /s* endpoints (create/claim/meta/burn).
RATE_LIMIT_PER_MIN = "30"
